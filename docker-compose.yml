services:
  postgres:
    image: postgres:16-alpine
    container_name: sagavortex-postgres
    environment:
      POSTGRES_DB: sagavortex_booking
      POSTGRES_USER: sagavortex
      POSTGRES_PASSWORD: 7fKp9mN2xQ4vLw8sRtZ1
    ports:
      - "5432:5432"
    volumes:
      - sagavortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagavortex -d sagavortex_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sagavortex_pgdata:
