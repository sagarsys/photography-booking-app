spring:
  application:
    # Service name shown in logs and metrics (like APP_NAME in Node).
    name: sagavortex-booking-api

  datasource:
    # Uses environment variables when deployed, with safe local defaults for Docker Compose.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sagavortex_booking}
    username: ${SPRING_DATASOURCE_USERNAME:sagavortex}
    password: ${SPRING_DATASOURCE_PASSWORD:7fKp9mN2xQ4vLw8sRtZ1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    # validate = Hibernate checks entities match the DB schema; it does NOT create tables.
    # Flyway owns schema changes (production-like, like Prisma migrate).
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    # false = do not keep DB session open through the entire HTTP request (avoids lazy-load surprises).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Run SQL migrations from classpath on startup.
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://photography-booking-app-nine.vercel.app}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

logging:
  level:
    # Keep startup + request logs for this app.
    com.sagavortex.booking: INFO
    # Keep startup summary line visible.
    org.flywaydb.core.internal.command.DbValidate: INFO
    # Trim framework noise while keeping warnings/errors.
    org.springframework: WARN
    org.apache.catalina: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: ERROR
